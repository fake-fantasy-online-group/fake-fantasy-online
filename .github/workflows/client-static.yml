name: Client static checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source and CI contracts without Unity or secrets
        run: |
          python3 -m unittest discover -s Tests/ClientBuild -p 'test_*.py' -v
          bash -n scripts/ci/*.sh Tests/ClientBuild/*.sh
      - name: Install distribution C# compiler for engine-free staging test
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mono-mcs libmono-i18n-cjk4.0-cil
      - name: Test resource staging and restoration
        run: Tests/ClientBuild/run-stage-contract.sh
